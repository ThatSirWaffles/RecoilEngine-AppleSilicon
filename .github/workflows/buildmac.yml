name: Build macOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build app
        run: make app

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: bar-launcher-macos
          path: |
            **/*.dmg
            **/*.zip
